[package]
name = "bpi-advanced-downloader"
version = "1.0.0"
description = "Advanced BPI Neural Web Infrastructure Downloader & Installer"
authors = ["BPI Team <team@bpi.network>"]
license = "MIT"
repository = "https://github.com/GlobalSushrut/PARVYOM-metanode"
edition = "2021"

[workspace]

# No build dependencies needed for CLI version

[dependencies]
# clap dependency moved below
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
async-trait = "0.1"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
tonic = "0.10"
prost = "0.12"
sysinfo = "0.30"
which = "4.4"
semver = "1.0"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
colored = "2.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3" }

[target.'cfg(unix)'.dependencies]
nix = "0.27"

# Features removed - CLI version doesn't need Tauri features
