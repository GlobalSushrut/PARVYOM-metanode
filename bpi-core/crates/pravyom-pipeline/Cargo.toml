[package]
name = "pravyom-pipeline"
version = "1.0.0"
edition = "2021"
description = "Pravyom Standard Pipeline v1.0 - Trait interfaces and core types"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
bls = []
pqc = []
