[package]
name = "bpi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "BPI Metanode Core - Community blockchain node"

[[bin]]
name = "bpi-core"
path = "src/main.rs"

[[bin]]
name = "domain-api-server"
path = "src/bin/domain_api_server.rs"

[[bin]]
name = "bpi-native-python-bridge"
path = "src/bin/bpi_native_python_bridge.rs"

[[bin]]
name = "pravyom"
path = "src/bin/pravyom.rs"
required-features = []

[dependencies]
tokio.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"
toml = "0.8"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tower = "0.4"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
bcrypt = "0.15"
jsonwebtoken = "9.2"
env_logger = "0.10"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
sysinfo = "0.29"
base64 = "0.21"
num_cpus = "1.16"
# Cryptographic dependencies for real QGC-C² consensus and BPI packets (using version 2.1 below)
serde_cbor = "0.11"
bincode = "1.3"
serde_bytes = "0.11"

# CLI-specific dependencies
tabled = "0.14"
csv = "1.3"
atty = "0.2"

# Mathematical dependencies for tetrabolic mesh
num-complex = "0.4"
nalgebra = { version = "0.32", features = ["serde-serialize"] }

# Shared components
crypto-primitives = { path = "../shared/crates/crypto-primitives" }
networking = { path = "../shared/crates/networking" }
storage = { path = "../shared/crates/storage" }

# Local BPI components
pravyom-pipeline = { path = "crates/pravyom-pipeline" }
protocols = { path = "../shared/crates/protocols" }

# BPI Core crates
bpi-headers = { path = "crates/metanode-consensus/bpi-headers" }
bpi-merkle = { path = "crates/metanode-core/merkle" }
ziplock-json = { path = "crates/ziplock-json" }
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
bitflags = { version = "2.4", features = ["serde"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
crc32fast = "1.3"
log = "0.4"

# Zero-Knowledge Proof Libraries (Production-Grade)
# Arkworks ecosystem for zk-SNARKs
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-bls12-381 = "0.4"
ark-snark = "0.4"

# Bulletproofs for range proofs
bulletproofs = "5.0"
curve25519-dalek = "4.1"
merlin = "3.0"

# Post-quantum cryptography
pqcrypto-dilithium = "0.5"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"

# Additional crypto primitives for ZK
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = "2.0"
serde_yaml = "0.9.34"
