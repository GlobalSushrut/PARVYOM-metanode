# HTTPCG/Shadow Registry NGINX Configuration - Simplified Working Version
server {
    listen 80;
    server_name pravyom.com *.pravyom.com;
    
    # Route traditional HTTP to static website (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTPCG Protocol Headers
        add_header X-HTTPCG-Protocol "1.0";
        add_header X-Shadow-Registry "enabled";
        add_header X-BPI-Integration "active";
        add_header Access-Control-Allow-Origin "*";
    }
    
    # Route HTTPCG protocol requests to BPI VM Server (port 7777)
    location /httpcg/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header X-HTTPCG-Request "true";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        add_header X-HTTPCG-Protocol "1.0";
        add_header X-Domain-Resolution "dynamic";
    }
    
    # Route to BPCI Enterprise API (port 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        add_header X-BPCI-Enterprise "true";
    }
    
    # HTTPCG Admin Dashboard (port 8888) - Revolutionary Domain System
    location /httpcg-admin/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header X-HTTPCG-Admin "enabled";
        add_header X-Shadow-Registry "integrated";
    }
    
    # HTTPCG Wallet Dashboard (port 7778) - Revolutionary Economic System
    location /httpcg-wallet/ {
        proxy_pass http://127.0.0.1:7778;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header X-HTTPCG-Wallet "enabled";
        add_header X-Autonomous-Runes "active";
    }
    
    # Shadow Registry Bridge endpoints (port 8888 - shared with admin)
    location /shadow/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header X-Shadow-Registry "true";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        add_header X-Web2-Web3-Bridge "active";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "HTTPCG System Operational\n";
        add_header Content-Type text/plain;
    }
}
