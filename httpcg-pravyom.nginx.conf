# HTTPCG/Shadow Registry NGINX Configuration
# The Most Complicated System Design Ever Attempted

server {
    listen 80;
    listen 443 ssl http2;
    server_name pravyom.com *.pravyom.com;
    
    # SSL Configuration (will be updated with Let's Encrypt)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    

    
    # Handle OPTIONS requests for HTTPCG protocol
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-HTTPCG-Protocol";
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type "text/plain charset=UTF-8";
        add_header Content-Length 0;
        return 204;
    }
    
    # Route traditional HTTP to static website (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # HTTPCG Protocol Headers
        add_header X-HTTPCG-Protocol "1.0" always;
        add_header X-Shadow-Registry "enabled" always;
        add_header X-BPI-Integration "active" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    }
    
    # Route HTTPCG protocol requests to BPI VM Server (port 7777)
    location /httpcg/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header X-HTTPCG-Request "true";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        
        # HTTPCG protocol specific headers
        proxy_set_header X-HTTPCG-Protocol "1.0";
        proxy_set_header X-Shadow-Registry "enabled";
        proxy_set_header X-Domain-Authority "hierarchical";
        
        # Timeout settings for complex domain resolution
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Route to BPCI Enterprise API (port 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API specific headers
        proxy_set_header X-BPCI-Enterprise "true";
        proxy_set_header X-Registry-Access "enabled";
    }
    
    # Shadow Registry Bridge endpoints (port 8888)
    location /shadow/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header X-Shadow-Registry "true";
        proxy_set_header X-Court-Bridge "enabled";
        proxy_set_header X-Web2-Web3-Bridge "active";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Security headers for Shadow Registry
        proxy_set_header X-Privacy-Preserving "true";
        proxy_set_header X-Cross-System-Auth "enabled";
    }
    
    # HTTPCG Admin Dashboard (port 8889)
    location /httpcg-admin/ {
        proxy_pass http://127.0.0.1:8889;
        proxy_set_header X-HTTPCG-Admin "true";
        proxy_set_header X-Admin-Dashboard "enabled";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Admin security headers
        proxy_set_header X-Admin-Access "restricted";
        proxy_set_header X-Security-Level "high";
    }
    
    # HTTPCG Wallet Dashboard (port 8890)
    location /httpcg-wallet/ {
        proxy_pass http://127.0.0.1:8890;
        proxy_set_header X-HTTPCG-Wallet "true";
        proxy_set_header X-Wallet-Dashboard "enabled";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Wallet security headers
        proxy_set_header X-Wallet-Security "post-quantum";
        proxy_set_header X-Economic-Integration "autonomous-runes";
    }
    
    # Dynamic HTTPCG domain resolution (catch-all for httpcg:// protocol)
    location ~* ^/httpcg-resolve/(.+)$ {
        proxy_pass http://127.0.0.1:7777/httpcg/$1;
        proxy_set_header X-HTTPCG-Dynamic-Resolution "true";
        proxy_set_header X-Domain-Query "$1";
        proxy_set_header X-Registry-Lookup "enabled";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "HTTPCG System Operational\n";
        add_header Content-Type text/plain;
    }
    
    # Monitoring endpoint for HTTPCG system status
    location /httpcg-status {
        proxy_pass http://127.0.0.1:7777/status;
        proxy_set_header X-System-Monitor "true";
        proxy_set_header Host $host;
    }
}

# Upstream definitions for load balancing
upstream httpcg_vm_server {
    server 127.0.0.1:7777 weight=3 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream shadow_registry {
    server 127.0.0.1:8888 weight=3 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream bpci_enterprise {
    server 127.0.0.1:8080 weight=3 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting for HTTPCG protocol
limit_req_zone $binary_remote_addr zone=httpcg_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shadow_limit:10m rate=5r/s;

# Cache configuration for HTTPCG domain resolution
proxy_cache_path /var/cache/nginx/httpcg levels=1:2 keys_zone=httpcg_cache:10m max_size=100m inactive=60m use_temp_path=off;
