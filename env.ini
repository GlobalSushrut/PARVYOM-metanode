# Pravyom / BPCI env.ini for local testnet
# Minimal configuration just to satisfy EnvIniParser for CLI tests

[network]
name = testnet
cluster_id = testnet-cluster-1
rpc_endpoint = http://127.0.0.1:8081

[logging]
level = info
output = stdout

[storage]
base_dir = /tmp/pravyom-storage

[commute_lock]
enabled = true
communication_mode = shared_memory
lock_dir = /tmp/bpci/lock
shm_dir = /tmp/bpci/shm
event_dir = /tmp/bpci/events
bpi_data_dir = /tmp/bpci/bpi_data
