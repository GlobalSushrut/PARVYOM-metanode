[package]
name = "dynaroute"
version = "0.1.0"
edition = "2021"
authors = ["BPCI Enterprise"]
description = "Identity-anycast dynamic routing for vPod infrastructure - shared library for BPCI and BPI"

[dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking
quinn = "0.10"
socket2 = "0.5"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rcgen = "0.11"

# Cryptography
blake3 = "1.5"
ed25519-dalek = "2.1"

# Data structures
parking_lot = "0.12"
dashmap = "5.5"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = "0.4"

[features]
default = []

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"
