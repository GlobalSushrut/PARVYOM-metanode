<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PRAVYOM Logo - Infinity with Network Nodes and U-base -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B44F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Infinity Symbol (∞) -->
  <path d="M16 24C16 20 20 16 24 16C28 16 32 20 32 24C32 20 36 16 40 16C44 16 48 20 48 24C48 28 44 32 40 32C36 32 32 28 32 24C32 28 28 32 24 32C20 32 16 28 16 24Z" 
        fill="url(#goldGradient)" stroke="#E8B44F" stroke-width="1"/>
  
  <!-- Network Nodes (5 dots) -->
  <circle cx="20" cy="12" r="2" fill="#E8B44F"/>
  <circle cx="28" cy="8" r="2" fill="#E8B44F"/>
  <circle cx="36" cy="8" r="2" fill="#E8B44F"/>
  <circle cx="44" cy="12" r="2" fill="#E8B44F"/>
  <circle cx="52" cy="16" r="2" fill="#E8B44F"/>
  
  <!-- Network Connections -->
  <path d="M20 12 L28 8 L36 8 L44 12 L52 16" stroke="#E8B44F" stroke-width="1" fill="none"/>
  
  <!-- U-shape Base -->
  <path d="M20 40 L20 52 Q20 56 24 56 L40 56 Q44 56 44 52 L44 40" 
        stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
